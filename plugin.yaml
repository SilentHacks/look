name: hermes-gaze
version: "0.1.0"
description: "Point with your eyes or cursor, command with your voice: multimodal deictic reference resolution ('what does this do?', 'export these') for Google Chrome and Hermes Agent."
author: "Abid"
kind: standalone
license: MIT
requires_hermes: ">=0.22.0"
platforms:
  - macos
  - linux
tags:
  - browser
  - gaze
  - voice
  - multimodal
  - accessibility
  - chrome
provides_tools:
  - gaze_resolve
  - gaze_choose
  - gaze_highlight
  - gaze_click
  - gaze_calibrate
  - gaze_benchmark
provides_hooks:
  - pre_llm_call
  - on_stream_delta
  - post_llm_call
  - on_session_end
config_schema:
  mode:
    type: str
    default: "hover"
    description: "Pointing source: 'hover' (exact cursor / Magic Pointer) or 'simulated' (cursor + Gaussian noise for gaze testing)."
  cdp_url:
    type: str
    default: "http://127.0.0.1:9222"
    description: "Local Chrome DevTools Protocol HTTP/WebSocket endpoint."
  sigma_px:
    type: float
    default: 120.0
    description: "Spatial uncertainty radius (CSS pixels) used in 'simulated' mode."
  dwell_ms:
    type: int
    default: 450
    description: "Dwell selection duration in milliseconds for Semantic Lens cards."
  wiggle_trigger:
    type: bool
    default: true
    description: "Summon the spotlight/HUD when the user quickly wiggles the cursor (Googlebook Magic Pointer style)."
  hotkey:
    type: str
    default: "AltRight"
    description: "Keyboard key (KeyboardEvent.code) that locks/unlocks the pointer target for safe HUD interaction (e.g., 'AltRight', 'Backquote', 'F8'). Push-to-talk is always Spacebar."
  whisper_model:
    type: str
    default: "base.en"
    description: "Local faster-whisper model name for deictic speech alignment."
  record_trials:
    type: bool
    default: false
    description: "Development only: write local replay evidence. May contain sensitive page text; never audio."
  early_highlight:
    type: bool
    default: true
    description: "Select intended scope immediately through TypeSafe using TYPESAFE_API_KEY; failure or no key uses the existing post-answer model."
  highlight_model:
    type: str
    default: "jev-1.14.0"
    description: "TypeSafe decision model for early highlights (direct TypeSafe API only)."
  highlight_include_page_text:
    type: bool
    default: false
    description: "Opt in to sending bounded captured page evidence to TypeSafe. Otherwise only the question, pointer structure and static scope descriptions are sent."
