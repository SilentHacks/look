name: hermes-gaze
version: "0.1.0"
description: "Look lets you ask about pages and review browser actions in Chrome. Beta support is limited to Apple Silicon Mac. Linux and Intel cursor paths are unverified. Start with /look. /gaze is an alias."
author: "Abid"
kind: standalone
license: MIT
requires_hermes: ">=0.23.1"
# Loader eligibility, not a tested-platform matrix. Linux cursor paths remain available.
platforms:
  - macos
  - linux
tags:
  - browser
  - gaze
  - voice
  - multimodal
  - accessibility
  - chrome
provides_tools:
  - gaze_resolve
  - gaze_choose
  - gaze_highlight
  - gaze_click
  - gaze_read
  - gaze_fill
  - gaze_press
  - gaze_open_tab
  - gaze_navigate
  - gaze_scroll
  - gaze_wait
  - gaze_request_commit
  - gaze_calibrate
  - gaze_benchmark
provides_hooks:
  - pre_llm_call
  - on_stream_delta
  - post_llm_call
  - on_session_end
  - on_session_reset
  - post_compaction
  - pre_tool_call
provides_middleware:
  - llm_request
  - tool_execution
config_schema:
  mode:
    type: str
    default: "hover"
    description: "Choose 'hover' for the pointer, 'simulated' for the pointer with added noise, or 'webcam' for calibrated eye tracking. Start the camera with /look eyes or /look calibrate."
  cdp_url:
    type: str
    default: "http://127.0.0.1:9333"
    description: "Verified Look companion only: http://127.0.0.1:<port> (localhost accepted). Arbitrary existing browsers and remote endpoints are refused. Never expose it to Hermes browser_exec/browser_cdp or BROWSER_CDP_URL."
  sigma_px:
    type: float
    default: 120.0
    description: "Uncertainty radius in CSS pixels for simulated and webcam gaze. This is not a measured accuracy rating."
  dwell_ms:
    type: int
    default: 450
    description: "How long to look at a Semantic Lens card to select it, in milliseconds."
  wiggle_trigger:
    type: bool
    default: false
    description: "Open the typed question card with a quick pointer wiggle."
  hotkey:
    type: str
    default: "AltRight"
    description: "Key used to hold or release the pointer target while using the question card. Use a KeyboardEvent.code such as 'AltRight', 'Backquote' or 'F8'. Hold Space to talk."
  whisper_model:
    type: str
    default: "base.en"
    description: "English faster-whisper model: base.en or tiny.en. Custom names, repositories and local paths are not supported."
  tts_voice:
    type: str
    default: "Russell"
    description: "English Phonon voice for read aloud. Download a different voice with scripts/setup_speech.py --voice NAME before selecting it."
  record_trials:
    type: bool
    default: false
    description: "Development only. Save local replay evidence, which may include sensitive page text. Audio is never saved."
  typesafe_api_key:
    type: secret
    label: "TypeSafe API key"
    env: TYPESAFE_API_KEY
    required: false
    description: "Optional key for early highlights. Without it, Hermes can choose highlights after answering."
  early_highlight:
    type: bool
    default: true
    description: "Use TypeSafe for early highlights. If no key is set or the request fails, Hermes can choose highlights after answering."
  highlight_model:
    type: str
    default: "jev-1.14.0"
    description: "TypeSafe model used for early highlights through the direct TypeSafe API."
  highlight_include_page_text:
    type: bool
    default: false
    description: "Also send captured page evidence to TypeSafe. When off, TypeSafe receives only your question, pointer structure and fixed descriptions of the available scopes."
  answer_turn_seconds:
    type: float
    default: 12.0
    description: "Seconds to show each unread answer before moving to the next or hiding the stack. Longer answers get more reading time."
