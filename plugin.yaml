name: hermes-gaze
version: "0.1.0"
description: "Look — private Chrome questions and guarded actions. Supported beta: Apple Silicon Mac; Linux/Intel cursor paths are unverified, not full-platform support. /look starts; /gaze is an alias."
author: "Abid"
kind: standalone
license: MIT
requires_hermes: ">=0.22.0"
# Loader eligibility, not a tested-platform matrix. Linux cursor paths remain available.
platforms:
  - macos
  - linux
tags:
  - browser
  - gaze
  - voice
  - multimodal
  - accessibility
  - chrome
provides_tools:
  - gaze_resolve
  - gaze_choose
  - gaze_highlight
  - gaze_click
  - gaze_read
  - gaze_fill
  - gaze_press
  - gaze_open_tab
  - gaze_navigate
  - gaze_scroll
  - gaze_wait
  - gaze_request_commit
  - gaze_calibrate
  - gaze_benchmark
provides_hooks:
  - pre_llm_call
  - on_stream_delta
  - post_llm_call
  - on_session_end
  - on_session_reset
  - post_compaction
  - pre_tool_call
provides_middleware:
  - llm_request
  - tool_execution
config_schema:
  mode:
    type: str
    default: "hover"
    description: "Pointing source: 'hover' (exact cursor), 'simulated' (cursor + noise), or 'webcam' (personal calibrated gaze). Camera starts only through /look calibrate or /look mode webcam."
  cdp_url:
    type: str
    default: "http://127.0.0.1:9333"
    description: "Verified Look companion only: http://127.0.0.1:<port> (localhost accepted). Arbitrary existing browsers and remote endpoints are refused. Never expose it to Hermes browser_exec/browser_cdp or BROWSER_CDP_URL."
  sigma_px:
    type: float
    default: 120.0
    description: "Spatial uncertainty radius (CSS pixels) for simulated or webcam gaze; not a measured accuracy claim."
  dwell_ms:
    type: int
    default: 450
    description: "Dwell selection duration in milliseconds for Semantic Lens cards."
  wiggle_trigger:
    type: bool
    default: false
    description: "Open the typed question card when the user quickly wiggles the cursor. Off by default: nothing appears unasked."
  hotkey:
    type: str
    default: "AltRight"
    description: "Keyboard key (KeyboardEvent.code) that locks/unlocks the pointer target for safe HUD interaction (e.g., 'AltRight', 'Backquote', 'F8'). Push-to-talk is always Spacebar."
  whisper_model:
    type: str
    default: "base.en"
    description: "Pinned English faster-whisper model: base.en or tiny.en only. Custom names, repositories and local paths are unsupported."
  tts_voice:
    type: str
    default: "Russell"
    description: "Downloaded English Phonon catalogue voice. Run scripts/setup_speech.py --voice NAME before selecting another voice."
  record_trials:
    type: bool
    default: false
    description: "Development only: write local replay evidence. May contain sensitive page text; never audio."
  typesafe_api_key:
    type: secret
    label: "TypeSafe API key"
    env: TYPESAFE_API_KEY
    required: false
    description: "Optional key for early highlights. Leave unset to use the post-answer model."
  early_highlight:
    type: bool
    default: true
    description: "Select intended scope immediately through TypeSafe using TYPESAFE_API_KEY; failure or no key uses the existing post-answer model."
  highlight_model:
    type: str
    default: "jev-1.14.0"
    description: "TypeSafe decision model for early highlights (direct TypeSafe API only)."
  highlight_include_page_text:
    type: bool
    default: false
    description: "Opt in to sending bounded captured page evidence to TypeSafe. Otherwise only the question, pointer structure and static scope descriptions are sent."
  answer_turn_seconds:
    type: float
    default: 12.0
    description: "How long each unseen answer stays forward before the next comes up or the stack retreats. Longer answers get more reading time."
