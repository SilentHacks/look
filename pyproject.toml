[project]
name = "hermes-gaze"
version = "0.1.0"
description = "Multimodal deictic reference resolution (pointer/gaze + speech + DOM) for Chrome and Hermes Agent"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
dependencies = [
    "websockets>=12.0,<16.0",
    "faster-whisper>=1.0.0,<2.0.0",
    "sounddevice>=0.4.6,<0.6.0",
    "numpy>=1.26.0,<3.0.0",
    "parakeet-mlx>=0.2.0,<1.0.0; sys_platform == 'darwin'",
    "pyobjc-framework-CoreML>=13.0,<14.0; sys_platform == 'darwin'",
    "huggingface_hub>=0.23.0,<2.0.0",
]

[project.optional-dependencies]
gaze-eval = ["scipy>=1.11,<2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
