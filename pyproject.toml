[project]
name = "hermes-gaze"
version = "0.1.0"
description = "Look — private questions and guarded browser actions for Chrome and Hermes Agent"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
dependencies = [
    "websockets>=15.0,<16.0",
    "faster-whisper>=1.0.0,<2.0.0",
    "sounddevice>=0.4.6,<0.6.0",
    "numpy>=1.26.0,<3.0.0",
    "parakeet-mlx>=0.2.0,<1.0.0; sys_platform == 'darwin'",
    "pyobjc-framework-CoreML>=13.0,<14.0; sys_platform == 'darwin'",
    "ptts==0.6.0",
    "huggingface_hub>=0.23.0,<2.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
